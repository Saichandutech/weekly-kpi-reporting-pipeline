name: Weekly KPI report

on:
  schedule:
    - cron: "0 12 * * 1"     # every Monday 12:00 UTC (7am Central)
  workflow_dispatch:          # allow manual runs from the Actions tab
  push:
    branches: [main]
  pull_request:               # run tests on proposed changes before they are merged

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run pipeline
        run: python run_pipeline.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-kpi-report
          path: output/
